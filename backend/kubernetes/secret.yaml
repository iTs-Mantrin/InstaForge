apiVersion: v1
kind: Secret
metadata:
  name: instaforge-secrets
  namespace: instaforge
  labels:
    app: instaforge
type: Opaque
stringData:
  DB_USER: instaforge
  DB_PASSWORD: replace-with-secure-password
  DB_REPLICA_USER: instaforge
  DB_REPLICA_PASSWORD: replace-with-secure-password

  REDIS_PASSWORD: ""

  JWT_SECRET: replace-with-64-char-random-string
  JWT_ACCESS_EXPIRY: 15m
  JWT_REFRESH_EXPIRY: 720h

  INSTAGRAM_API_KEY: replace-with-instagram-api-key
  INSTAGRAM_API_BASE_URL: https://instagram-scraper.example.com
  INSTAGRAM_RAPIDAPI_KEY: ""
  INSTAGRAM_RAPIDAPI_HOST: ""

  S3_ACCESS_KEY: replace-with-s3-access-key
  S3_SECRET_KEY: replace-with-s3-secret-key
  S3_BUCKET: instaforge-media
  S3_REGION: auto
  S3_ENDPOINT: https://s3.example.com

  CF_API_TOKEN: replace-with-cloudflare-api-token
  CF_ZONE_ID: replace-with-cloudflare-zone-id
  CF_ACCOUNT_ID: replace-with-cloudflare-account-id
