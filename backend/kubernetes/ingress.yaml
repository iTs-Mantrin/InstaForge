apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: instaforge
  namespace: instaforge
  labels:
    app: instaforge
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-API-Key, X-Request-ID"
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/limit-rpm: "6000"
spec:
  tls:
  - hosts:
    - api.instaforge.com
    secretName: instaforge-tls
  rules:
  - host: api.instaforge.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: instaforge
            port:
              number: 8080
